# The merge checklist from AGENTS.md, on every PR and every push to main: the repo check (with the Worker tests), every
# app's unit tests, the proof-read, and each app's browser suites (one job each, side by side).
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
      - name: Repo check
        run: node tools/check.mjs
      - name: Unit tests
        run: for f in nuh-roster/test/*.test.mjs ntf-roster/test/*.test.mjs nuh-junior-monthly/test/*.test.mjs lib/roster-core/test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done
      - name: Proof-read (pages and documents)
        run: node tools/proofread.mjs

  rules:
    # Firestore rules in the emulators (tools/test-rules.sh): for every app its own checks, the rules kit's shared suite,
    # its claims Worker end to end and a stale built firestore.rules; and unchanged kit copies.
    # The kit is pinned exactly: firestore.rules is built from its common.rules.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
      - uses: flamingbeing/app-devkit/setup-emulators@v1.4.0
        with:
          emulators: firestore,auth
          devkit-dir: .devkit
      - name: The Worker's kit copies are unchanged
        run: for f in claims.js custom-token.js; do diff -u ".devkit/worker/$f" "worker/$f" || exit 1; done
      - name: Rules tests
        run: |
          mkdir -p ~/.cache/anawj-rules
          npm install --silent --no-audit --no-fund --prefix ~/.cache/anawj-rules @firebase/rules-unit-testing firebase
          ln -s "$(command -v firebase)" ~/.cache/anawj-rules/node_modules/.bin/firebase
          bash tools/test-rules.sh

  browser:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium for 26.04 (ubuntu-latest)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: NUH roster, cmd: "node nuh-roster/test/e2e.mjs" }
          # speed budgets: timings vary, so perf fails only if a second run is over too
          - { name: NTF roster, cmd: "node ntf-roster/test/e2e.mjs && node ntf-roster/test/tour.e2e.mjs && node ntf-roster/test/pool.e2e.mjs && (node ntf-roster/test/perf.e2e.mjs || node ntf-roster/test/perf.e2e.mjs)" }
          - { name: NUH junior monthly, cmd: "node nuh-junior-monthly/test/e2e.mjs" }
    name: browser (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
      - name: Install Playwright
        run: npm install -g playwright@1.56.1
      - uses: flamingbeing/app-devkit/setup-browser@v1
        with:
          playwright-version: '1.56.1'
          devkit-dir: ''
      - name: Test
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs"
          (python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 1
          ${{ matrix.cmd }}
