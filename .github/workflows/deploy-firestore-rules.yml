# Deploys each app's firestore.rules to its Firebase project when the file changes on main (or by hand: Run workflow
# deploys all three). It signs in with GitHub's OIDC token (Workload Identity Federation: only this repo may use the
# provider) as a service account in nuh-roster that can only change rules in the three projects, so no key is stored.
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - 'nuh-roster/firestore.rules'
      - 'nuh-junior-monthly/firestore.rules'
      - 'ntf-roster/firestore.rules'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      roster: ${{ steps.filter.outputs.roster }}
      junior: ${{ steps.filter.outputs.junior }}
      ntf: ${{ steps.filter.outputs.ntf }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            roster: 'nuh-roster/firestore.rules'
            junior: 'nuh-junior-monthly/firestore.rules'
            ntf: 'ntf-roster/firestore.rules'

  deploy:
    needs: changes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: nuh-roster, project: nuh-roster, changed: roster }
          - { dir: nuh-junior-monthly, project: nuh-junior-monthly, changed: junior }
          - { dir: ntf-roster, project: ntf-roster, changed: ntf }
    env:
      GO: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.changed] == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.GO == 'true'
      - uses: google-github-actions/auth@v2
        if: env.GO == 'true'
        with:
          workload_identity_provider: projects/406161319783/locations/global/workloadIdentityPools/github/providers/rosters-repo
          service_account: firebase-rules-deployer@nuh-roster.iam.gserviceaccount.com
      - name: Deploy ${{ matrix.dir }}/firestore.rules to ${{ matrix.project }}
        if: env.GO == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          echo '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
          npx --yes firebase-tools@13 deploy --only firestore:rules --project ${{ matrix.project }} --non-interactive
