# Deploys this repo's Worker on every push to main (and to beta, as the Worker's "beta" environment, if
# wrangler.jsonc has one). The deploy build stamps the service worker versions first (tools/stamp-versions.mjs).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the run says so and skips.
name: Deploy

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: flamingbeing/app-devkit/.github/workflows/deploy-worker.yml@v1
    with:
      stamp-command: node tools/stamp-versions.mjs   # dates each app by its last commit
      beta-env: true
    secrets: inherit
