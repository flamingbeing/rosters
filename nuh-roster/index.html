<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script>
// The roster now lives at nuhroster.anawj.com. The same folder is still served at anawj.com/nuh-roster/, so send
// visitors on from there (path, query and # kept). Only when it is the top page, and a no-op on nuhroster.anawj.com,
// previews and localhost (no loop). A browser with a roster saved at the old address stays for a moment: what is
// saved in a browser belongs to its address, so the page offers to download it first (window.ROSTER_MOVED_TO).
if (top === self && /^(www\.)?anawj\.com$/.test(location.hostname)) (function () {
  var to = 'https://nuhroster.anawj.com/' + location.pathname.replace(/^\/nuh-roster\/?/, '') + location.search + location.hash;
  var saved = false;
  try { saved = !!localStorage.getItem('ot-roster-v1') && !localStorage.getItem('nuh-roster-moved'); } catch (e) { /* no storage */ }
  if (saved && !/[?&]demo\b/.test(location.search)) window.ROSTER_MOVED_TO = to;
  else location.replace(to);
})();
</script>
<title>NUH Roster</title>
<link rel="manifest" href="manifest.webmanifest">
<script>addEventListener('beforeinstallprompt', e => e.preventDefault());</script>
<meta name="theme-color" content="#f9f9fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roster">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Draft the daily anaesthesia OT roster and export it as an Excel file. Runs entirely in your browser.">
<!-- the UI kit (app-ui, exact version; lib/roster-core/kit.js): this device's look, theme and density, before the NUHS kit -->
<script src="https://core.anawj.com/ui/1.0.0-rc.23/theme/early.js"></script>
<link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.23/theme/theme.css">
<link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.23/ui/layout.css">
<link rel="stylesheet" href="https://design.anawj.com/v1/tokens.css">
<link rel="stylesheet" href="https://design.anawj.com/v1/app.css">
<link rel="stylesheet" href="style.css">
<script src="https://design.anawj.com/v1/app.js" defer></script>
</head>
<body class="a-app">
<header class="a-bar top">
  <div class="a-band"><i></i><i></i><i></i><i></i></div>
  <div class="top-row">
    <div class="brand">
      <h1>NUH Roster</h1>
      <p class="privacy" id="privacy">Runs in this browser only. Nothing you enter or load is uploaded.</p>
    </div>
    <div id="date" class="datebar"></div>
    <div class="team">
      <div id="cloud" class="cloud"></div>
    </div>
  </div>
</header>
<div id="bars" class="bars"></div>

<nav class="a-tabbar tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="monthly"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="tab-text">Monthly</span></button>
  <button role="tab" data-tab="cases"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h6"/></svg><span class="tab-text">Cases</span></button>
  <button role="tab" data-tab="roster"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 14.5h18M9 4v16"/></svg><span class="tab-text">Roster</span></button>
  <button role="tab" data-tab="premed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 20.5a4.95 4.95 0 01-7-7l6-6a4.95 4.95 0 017 7z"/><path d="M8.5 8.5l7 7"/></svg><span class="tab-text">Premeds</span></button>
  <button role="tab" data-tab="staff" class="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.6a3.5 3.5 0 010 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg><span class="tab-text">Staff</span></button>
  <button role="tab" data-tab="settings" class="setup" aria-label="Settings" title="Settings"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 010-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 014 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 010 4h-.1a1.6 1.6 0 00-1.5 1z"/><circle cx="12" cy="12" r="3"/></svg><span class="tab-text">Settings</span></button>
</nav>
<h2 id="screen-title" class="a-title screen-title" hidden></h2>
<div id="steps" class="steps" hidden></div>

<main id="app" class="a-main a-main--wide"></main>
<footer class="foot">
  <div class="foot-group">
    <p class="a-section" id="foot-file">Staff list, rooms and settings as a file:</p>
    <ul class="a-list" aria-labelledby="foot-file">
      <li><button id="saveTeam" class="a-row" title="Download the staff list, rooms and settings as a JSON file"><span class="a-row-text">Export JSON</span></button></li>
      <li><label class="a-row" title="Replace the staff list, rooms and settings from a JSON file"><span class="a-row-text">Import JSON</span><input id="loadTeam" type="file" accept=".json,application/json" hidden></label></li>
      <li><button id="allBtn" class="a-row" title="Everything this browser holds (staff, settings, every day's roster, monthly rosters, rotations) as one file, to keep or to move to another computer"><span class="a-row-text">Download everything</span></button></li>
    </ul>
  </div>
  <div class="foot-group">
    <ul class="a-list">
      <li><a id="mydayLink" class="a-row" href="#myday" title="Where one person is on the day: bookmark it for your own day"><span class="a-row-text">My day</span><span class="a-chev"></span></a></li>
      <li><button id="tourBtn" class="a-row" title="A short tour of the app"><span class="a-row-text">Tour</span></button></li>
      <li><button id="keyBtn" class="a-row" title="What the marks and colours mean, and how to do common things"><span class="a-row-text">Key and help</span></button></li>
      <li><button id="keysBtn" class="a-row" title="Keyboard shortcuts (?)"><span class="a-row-text">Keyboard shortcuts</span></button></li>
    </ul>
  </div>
</footer>
<div id="toast" class="a-toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
